name: Build Windows EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: reply_timer_gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reply_timer_gui
      - name: Build
        run: cargo build --release
      - name: Rename
        run: Copy-Item target/release/reply_timer_gui.exe ReplyTimer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ReplyTimer
          path: reply_timer_gui/ReplyTimer.exe
